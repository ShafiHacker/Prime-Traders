<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | Prime Traders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-image: url('bg-login.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4 bg-slate-950/20 relative">

    <!-- Top Left Home Button -->
    <a href="index.html" class="absolute top-4 left-4 md:top-6 md:left-6 bg-slate-900/90 hover:bg-amber-500 text-slate-200 hover:text-slate-950 border border-slate-700/80 hover:border-amber-400 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-xl backdrop-blur-md z-50">
        <i class="fa-solid fa-house"></i> Home
    </a>

    <!-- Auth Container -->
    <div class="bg-slate-900/90 border border-slate-700/80 p-6 md:p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-5 text-slate-100 backdrop-blur-md my-8">
        
        <!-- Logo Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex bg-amber-500 text-slate-950 font-black text-2xl w-12 h-12 items-center justify-center rounded-xl shadow-lg mb-1">P</div>
            <h1 class="text-xl font-black tracking-wider text-white uppercase">PRIME TRADERS</h1>
            <p class="text-[11px] text-amber-400 tracking-widest font-semibold uppercase">Express & Logistics Portal</p>
        </div>

        <!-- Alert / Error Message -->
        <div id="authMsg" class="hidden p-3 bg-rose-950/80 border border-rose-500/50 text-rose-300 text-xs rounded-lg text-center font-medium"></div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-700 text-sm font-bold">
            <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 text-center text-amber-400 border-b-2 border-amber-400 focus:outline-none transition">Sign In</button>
            <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-200 focus:outline-none transition">Register Account</button>
        </div>

        <!-- 1. LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Email Address</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3 top-3 text-slate-500"></i>
                    <input type="email" id="loginEmail" placeholder="user@example.com" required class="w-full pl-9 p-2.5 bg-slate-950/80 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400 transition">
                </div>
            </div>
            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-500"></i>
                    <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full pl-9 p-2.5 bg-slate-950/80 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400 transition">
                </div>
            </div>
            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-lg text-xs tracking-wider uppercase shadow-lg transition transform active:scale-95">
                Sign In to Dashboard
            </button>
        </form>

        <!-- 2. REGISTER FORM -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3 text-xs hidden max-h-[60vh] overflow-y-auto pr-1">
            <input type="hidden" id="regAccountType" value="business">

            <!-- Account Type Selector -->
            <div class="flex gap-2 mb-2">
                <button type="button" id="btnTypeBusiness" onclick="setAccountType('business')" class="flex-1 py-2 text-xs font-bold rounded-lg border border-amber-400 bg-amber-400 text-slate-900 transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-briefcase"></i> Business Account
                </button>
                <button type="button" id="btnTypeSelf" onclick="setAccountType('self')" class="flex-1 py-2 text-xs font-bold rounded-lg border border-slate-700 bg-slate-900 text-slate-400 hover:text-white transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-user"></i> Self Account
                </button>
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Full Name *</label>
                <input type="text" id="regName" placeholder="Ali Raza" required class="w-full p-2.5 bg-slate-950/80 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
            </div>

            <div id="businessNameField">
                <label class="block text-slate-300 mb-1 font-semibold">Business Name *</label>
                <input type="text" id="regBusinessName" placeholder="Prime Traders Store" required class="w-full p-2.5 bg-slate-950/80 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Email Address *</label>
                    <input type="email" id="regEmail" placeholder="user@example.com" required class="w-full p-2.5 bg-slate-950/80 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Mobile / WhatsApp No *</label>
                    <input type="text" id="regPhone" placeholder="03XXXXXXXXX" required class="w-full p-2.5 bg-slate-950/80 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">CNIC Number *</label>
                    <input type="text" id="regCNIC" placeholder="42101-XXXXXXX-X" required class="w-full p-2.5 bg-slate-950/80 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
                <div id="ntnNumField">
                    <label class="block text-slate-300 mb-1 font-semibold">NTN Number *</label>
                    <input type="text" id="regNTN" placeholder="1234567-8" required class="w-full p-2.5 bg-slate-950/80 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Bank Account Details (Title, IBAN, Bank)</label>
                <input type="text" id="regBank" placeholder="Meezan Bank - PK00 MEZN 0000 1234 5678" class="w-full p-2.5 bg-slate-950/80 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Password *</label>
                <input type="password" id="regPassword" placeholder="Minimum 6 characters" required class="w-full p-2.5 bg-slate-950/80 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
            </div>

            <!-- File Uploads -->
            <div class="border-t border-slate-800 pt-2 space-y-2">
                <p class="font-bold text-slate-400 text-[11px]">Verification Documents (PNG/JPG/PDF):</p>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 text-[10px]">CNIC Front Image</label>
                        <input type="file" id="fileCnicFront" accept="image/*,.pdf" class="w-full text-slate-400 text-[10px] bg-slate-950 p-1.5 border border-slate-700 rounded">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-[10px]">CNIC Back Image</label>
                        <input type="file" id="fileCnicBack" accept="image/*,.pdf" class="w-full text-slate-400 text-[10px] bg-slate-950 p-1.5 border border-slate-700 rounded">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div id="ntnFileField">
                        <label class="block text-slate-400 text-[10px]">NTN Certificate File</label>
                        <input type="file" id="fileNTN" accept="image/*,.pdf" class="w-full text-slate-400 text-[10px] bg-slate-950 p-1.5 border border-slate-700 rounded">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-[10px]">Bank Cheque / Proof</label>
                        <input type="file" id="fileBank" accept="image/*,.pdf" class="w-full text-slate-400 text-[10px] bg-slate-950 p-1.5 border border-slate-700 rounded">
                    </div>
                </div>
            </div>

            <button type="submit" id="regSubmitBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-lg text-xs tracking-wider uppercase shadow-lg transition mt-2">
                Create Account
            </button>
        </form>

    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="dashboard.js?v=8.0"></script>
</body>
</html>
