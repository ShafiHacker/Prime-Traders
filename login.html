<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | Prime Traders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <!-- EmailJS SDK Initialization -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("Vb2gIAifYSFFhRxnJ");
       })();
    </script>
</head>
<body class="min-h-screen bg-cover bg-center bg-no-repeat flex items-center justify-center p-4 font-sans relative" style="background-image: url('./bg-login.png');">

    <div class="relative z-10 bg-slate-800/90 border border-slate-700/80 backdrop-blur-md p-6 md:p-8 rounded-2xl shadow-2xl max-w-lg w-full my-6">
        <!-- Logo Header -->
        <div class="text-center mb-6">
            <div class="bg-amber-500 text-slate-900 font-black text-3xl w-14 h-14 mx-auto flex items-center justify-center rounded-xl mb-3 shadow-lg">P</div>
            <h1 class="text-2xl font-bold tracking-wider text-white uppercase">PRIME TRADERS</h1>
            <p class="text-xs text-amber-400 tracking-widest uppercase">Express & Logistics Portal</p>
        </div>

        <!-- Tab Toggle -->
        <div class="flex border-b border-slate-700 mb-6 text-sm font-semibold">
            <button id="tabLogin" type="button" onclick="switchTab('login')" class="flex-1 py-2 text-center text-amber-400 border-b-2 border-amber-400 focus:outline-none">Sign In</button>
            <button id="tabRegister" type="button" onclick="switchTab('register')" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-200 focus:outline-none">Register Account</button>
        </div>

        <!-- Login Form (Now wrapped in <form> for Enter key support) -->
        <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                <input type="email" id="loginEmail" required placeholder="user@example.com" class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold py-3 rounded-lg transition shadow-md">
                Sign In to Dashboard
            </button>
        </form>

        <!-- Signup Form -->
        <form id="registerForm" class="space-y-4 hidden" onsubmit="handleRegister(event)">
            <!-- Account Type Switcher Buttons -->
            <div class="flex gap-2 mb-2">
                <button type="button" id="btnTypeBusiness" onclick="setAccountType('business')" class="flex-1 py-2 text-xs font-bold rounded-lg border border-amber-400 bg-amber-400 text-slate-900 transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-briefcase"></i> Business Account
                </button>
                <button type="button" id="btnTypeSelf" onclick="setAccountType('self')" class="flex-1 py-2 text-xs font-bold rounded-lg border border-slate-700 bg-slate-900 text-slate-400 hover:text-white transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-user"></i> Self Account
                </button>
            </div>
            <input type="hidden" id="regAccountType" value="business">

            <!-- Full Name & Business Name -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name *</label>
                <input type="text" id="regName" required placeholder="Ali Raza" class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <div id="businessNameField">
                <label class="block text-xs font-semibold text-slate-300 mb-1">Business Name *</label>
                <input type="text" id="regBusinessName" placeholder="Prime Traders Store" class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <!-- Email & Mobile -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address *</label>
                    <input type="email" id="regEmail" required placeholder="user@example.com" class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Mobile / WhatsApp No *</label>
                    <input type="text" id="regPhone" required placeholder="03XXXXXXXXX" class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <!-- CNIC & NTN -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">CNIC Number *</label>
                    <input type="text" id="regCNIC" required placeholder="42101-XXXXXXXX-X" class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div id="ntnNumField">
                    <label class="block text-xs font-semibold text-slate-300 mb-1">NTN Number *</label>
                    <input type="text" id="regNTN" placeholder="1234567-8" class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>

            <!-- Bank Details -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Bank Account Details (Bank Name & IBAN/Acc No) *</label>
                <input type="text" id="regBank" required placeholder="Meezan Bank - PK00MEZN00000000000" class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <!-- Required Proof Attachments -->
            <div class="p-3 bg-slate-900/80 border border-slate-700 rounded-lg space-y-3">
                <p class="text-[11px] font-bold text-amber-400 uppercase tracking-wider">Required Proof Documents</p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    <div>
                        <label class="block text-slate-400 mb-1">CNIC Front Picture *</label>
                        <input type="file" id="fileCnicFront" accept="image/*" required class="w-full text-slate-400 text-xs">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">CNIC Back Picture *</label>
                        <input type="file" id="fileCnicBack" accept="image/*" required class="w-full text-slate-400 text-xs">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    <div id="ntnFileField">
                        <label class="block text-slate-400 mb-1">NTN Document Data *</label>
                        <input type="file" id="fileNTN" accept="image/*,.pdf" class="w-full text-slate-400 text-xs">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Bank Cheque / Proof *</label>
                        <input type="file" id="fileBank" accept="image/*,.pdf" required class="w-full text-slate-400 text-xs">
                    </div>
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password *</label>
                <input type="password" id="regPassword" required placeholder="••••••••" class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <button type="submit" id="regSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3 rounded-lg transition shadow-md">
                Create Account
            </button>
        </form>

        <p id="authMsg" class="mt-4 text-xs text-center text-red-400 font-semibold hidden"></p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Main App Script -->
    <script src="dashboard.js?v=4.0"></script>
</body>
</html>
