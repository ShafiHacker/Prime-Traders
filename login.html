<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | Prime Traders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
<!-- EmailJS SDK Initialization -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
   (function(){
      emailjs.init("Vb2gIAifYSFFhRxnJ");
   })();
</script></head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl max-w-md w-full">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div class="bg-amber-500 text-slate-900 font-black text-3xl w-14 h-14 mx-auto flex items-center justify-center rounded-xl mb-3 shadow-lg">P</div>
            <h1 class="text-2xl font-bold tracking-wider text-white uppercase">PRIME TRADERS</h1>
            <p class="text-xs text-amber-400 tracking-widest uppercase">Express & Logistics Portal</p>
        </div>

        <!-- Tab Toggle -->
        <div class="flex border-b border-slate-700 mb-6 text-sm font-semibold">
            <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 text-center text-amber-400 border-b-2 border-amber-400 focus:outline-none">Sign In</button>
            <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-200 focus:outline-none">Register Account</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                <input type="email" id="loginEmail" required placeholder="user@example.com" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
           <!-- Login Form -->
<form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
  <div>
    <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
    <input type="email" id="loginEmail" required placeholder="user@example.com" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
  </div>
  <div>
    <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
  </div>

  <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold py-3 rounded-lg transition shadow-md">
    Sign In to Dashboard
  </button>
</form>

       <!-- Signup Form -->
<form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name / Business Name</label>
                <input type="text" id="regName" required placeholder="Ali Raza" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                <input type="email" id="regEmail" required placeholder="user@example.com" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Mobile / WhatsApp Number</label>
                <input type="text" id="regPhone" required placeholder="03XXXXXXXXX" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" id="regPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <button type="button" onclick="handleSignUp(event)" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3 rounded-lg transition shadow-md">
   Create Account
</button>
        </form>

        <p id="authMsg" class="mt-4 text-xs text-center text-red-400 font-semibold hidden"></p>
    </div>

    <!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- EmailJS SDK -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
   (function(){
      emailjs.init("Vb2gIAifYSFFhRxnJ");
   })();
</script>

<!-- Main App Script -->
<script src="dashboard.js"></script>
</body>
</html>
