<!DOCTYPE html>
<html lang="en">
<head>
    <style>
  /* Full-screen Animated Stars Backdrop (hides old background visuals) */
  .prime-stars-bg {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    background: radial-gradient(circle at 25% 35%, #171923 0%, #090b10 65%, #050609 100%) !important;
    overflow: hidden !important;
    z-index: 5 !important;
    pointer-events: none;
  }

  .prime-star-dot {
    position: absolute;
    border-radius: 9999px;
    background: #fef08a;
    opacity: 0.75;
    animation: primeStarTwinkle var(--dur, 3.2s) ease-in-out infinite;
  }

  @keyframes primeStarTwinkle {
    0%, 100% {
      opacity: 0.2;
      transform: translateY(0px) scale(0.85);
    }
    50% {
      opacity: 0.95;
      transform: translateY(-6px) scale(1.2);
    }
  }

  /* Clean Lamp + Login Row without extra box/title */
  .prime-lamp-stage {
    position: relative;
    z-index: 30;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 44px;
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
  }

  .prime-lamp-only {
    position: relative;
    width: 240px;
    height: 310px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Warm light cast toward the login form on the right */
  .prime-lamp-cast {
    position: absolute;
    top: 84px;
    left: 125px;
    width: 340px;
    height: 210px;
    background: radial-gradient(ellipse at 15% 45%, rgba(250, 204, 21, 0.34) 0%, rgba(245, 158, 11, 0.12) 45%, transparent 75%);
    transform: rotate(-6deg);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 1;
  }

  .prime-lamp-only.is-on .prime-lamp-cast {
    opacity: 1;
  }

  .prime-lamp-svg {
    position: relative;
    z-index: 2;
    overflow: visible;
  }

  .prime-lamp-cord-group {
    cursor: pointer;
    transform-box: fill-box;
    transform-origin: top center;
    transition: transform 0.16s ease;
  }

  .prime-lamp-cord-group.pulled {
    transform: translateY(8px);
  }

  .prime-login-glow {
    box-shadow: -22px 0 48px rgba(250, 204, 21, 0.25), 0 22px 50px rgba(0, 0, 0, 0.65) !important;
    border-color: rgba(250, 204, 21, 0.45) !important;
    transition: box-shadow 0.3s ease, border-color 0.3s ease;
  }
</style>

<script>
(function setupCleanLampWithStars() {
  let lampOn = true;

  function playSwitchSound(turnOn) {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      const ctx = new AudioContextClass();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(turnOn ? 880 : 520, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(turnOn ? 1380 : 260, ctx.currentTime + 0.065);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.075);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    } catch (_) {}
  }

  function mountAnimatedStars() {
    if (document.getElementById("primeAnimatedStarsBg")) return;
    const bg = document.createElement("div");
    bg.id = "primeAnimatedStarsBg";
    bg.className = "prime-stars-bg";

    const starCount = 75;
    for (let i = 0; i < starCount; i++) {
      const star = document.createElement("span");
      star.className = "prime-star-dot";
      const size = (i % 3 === 0) ? 3 : (i % 2 === 0 ? 2 : 1.5);
      star.style.width = size + "px";
      star.style.height = size + "px";
      star.style.left = ((i * 37) % 100) + "%";
      star.style.top = ((i * 53) % 100) + "%";
      star.style.setProperty("--dur", (2.2 + (i % 6) * 0.7) + "s");
      star.style.animationDelay = ((i % 9) * 0.35) + "s";
      bg.appendChild(star);
    }
    document.body.prepend(bg);
  }

  function createReferenceLamp(loginCard) {
    const wrap = document.createElement("div");
    wrap.className = "prime-lamp-only is-on";
    wrap.innerHTML = `
      <div class="prime-lamp-cast"></div>
      <svg class="prime-lamp-svg" viewBox="0 0 220 270" width="225" height="275">
        <defs>
          <radialGradient id="primeBulbGlowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fef9c3" stop-opacity="1"/>
            <stop offset="55%" stop-color="#facc15" stop-opacity="0.75"/>
            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Soft aura around bulb -->
        <circle class="prime-bulb-aura" cx="148" cy="112" r="34" fill="url(#primeBulbGlowGrad)" opacity="0.9"/>

        <!-- Base -->
        <ellipse cx="74" cy="246" rx="46" ry="9" fill="#18181b" stroke="#eab308" stroke-width="2"/>
        <path d="M56 244 L62 232 L86 232 L92 244 Z" fill="#27272a" stroke="#eab308" stroke-width="1.5"/>

        <!-- Articulated Arm -->
        <line x1="74" y1="232" x2="108" y2="152" stroke="#52525b" stroke-width="8" stroke-linecap="round"/>
        <line x1="74" y1="232" x2="108" y2="152" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
        <circle cx="108" cy="152" r="9" fill="#eab308" stroke="#18181b" stroke-width="2.5"/>
        <line x1="108" y1="152" x2="144" y2="88" stroke="#52525b" stroke-width="7" stroke-linecap="round"/>
        <line x1="108" y1="152" x2="144" y2="88" stroke="#d4d4d8" stroke-width="2" stroke-linecap="round"/>

        <!-- Dome Shade -->
        <path d="M104 94 C112 56, 182 56, 190 94 Z" fill="#27272a" stroke="#eab308" stroke-width="2.2"/>
        <ellipse cx="147" cy="94" rx="43" ry="7" fill="#eab308" opacity="0.85"/>

        <!-- Bulb -->
        <circle class="prime-bulb-glass" cx="148" cy="108" r="10" fill="#fef08a" stroke="#f59e0b" stroke-width="1.5"/>

        <!-- Pull Cord (Click to Toggle Light + Sound) -->
        <g class="prime-lamp-cord-group" title="Pull cord to toggle light">
          <line x1="158" y1="106" x2="158" y2="174" stroke="#eab308" stroke-width="2.2"/>
          <ellipse cx="158" cy="181" rx="5.5" ry="8" fill="#eab308" stroke="#fef08a" stroke-width="1.2"/>
        </g>
      </svg>
    `;

    function syncVisuals() {
      wrap.classList.toggle("is-on", lampOn);
      const aura = wrap.querySelector(".prime-bulb-aura");
      const bulb = wrap.querySelector(".prime-bulb-glass");
      if (aura) aura.setAttribute("opacity", lampOn ? "0.9" : "0");
      if (bulb) bulb.setAttribute("fill", lampOn ? "#fef08a" : "#3f3f46");
      if (loginCard) loginCard.classList.toggle("prime-login-glow", lampOn);
    }

    const cord = wrap.querySelector(".prime-lamp-cord-group");
    const bulbHit = wrap.querySelector(".prime-bulb-glass");

    function handlePull() {
      lampOn = !lampOn;
      playSwitchSound(lampOn);
      cord.classList.add("pulled");
      setTimeout(() => cord.classList.remove("pulled"), 180);
      syncVisuals();
    }

    cord.addEventListener("click", handlePull);
    if (bulbHit) {
      bulbHit.style.cursor = "pointer";
      bulbHit.addEventListener("click", handlePull);
    }

    syncVisuals();
    return wrap;
  }

  function attachLampStage() {
    mountAnimatedStars();
    if (document.querySelector(".prime-lamp-only")) return;

    const card =
      document.querySelector("#studentLoginForm")?.closest("div.bg-slate-900, div[class*='max-w-']") ||
      document.querySelector("form[id*='Login'], form[id*='login']")?.closest("div");

    if (!card || !card.parentNode) return;

    const stage = document.createElement("div");
    stage.className = "prime-lamp-stage";
    card.parentNode.insertBefore(stage, card);
    stage.appendChild(createReferenceLamp(card));
    stage.appendChild(card);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", attachLampStage);
  } else {
    attachLampStage();
  }

  const observer = new MutationObserver(() => attachLampStage());
  observer.observe(document.body, { childList: true, subtree: true });
})();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | Prime Traders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .bg-custom-fit {
            background-image: url('bg-login.png');
            background-size: 100% 100%;
            background-position: center center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-custom-fit min-h-screen w-full flex items-center justify-center p-4 relative">

    <!-- Top Left Home Button -->
    <a href="index.html" class="absolute top-4 left-4 md:top-6 md:left-6 bg-slate-900/90 hover:bg-amber-500 text-slate-200 hover:text-slate-950 border border-slate-700/80 hover:border-amber-400 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-xl backdrop-blur-md z-50">
        <i class="fa-solid fa-house"></i> Home
    </a>

    <!-- Auth Container Box -->
    <div class="bg-slate-900/95 border border-slate-700/80 p-6 md:p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-5 text-slate-100 backdrop-blur-md my-auto">
        
        <!-- Logo Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex bg-amber-500 text-slate-950 font-black text-2xl w-12 h-12 items-center justify-center rounded-xl shadow-lg mb-1">P</div>
            <h1 class="text-xl font-black tracking-wider text-white uppercase">PRIME TRADERS</h1>
            <p class="text-[11px] text-amber-400 tracking-widest font-semibold uppercase">Express & Logistics Portal</p>
        </div>

        <!-- Alert / Error Message -->
        <div id="authMsg" class="hidden p-3 bg-rose-950/80 border border-rose-500/50 text-rose-300 text-xs rounded-lg text-center font-medium"></div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-700 text-sm font-bold">
            <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 text-center text-amber-400 border-b-2 border-amber-400 focus:outline-none transition">Sign In</button>
            <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-200 focus:outline-none transition">Register Account</button>
        </div>

        <!-- 1. LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Email Address</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3 top-3 text-slate-500"></i>
                    <input type="email" id="loginEmail" placeholder="user@example.com" required class="w-full pl-9 p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400 transition">
                </div>
            </div>
            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-500"></i>
                    <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full pl-9 pr-10 p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400 transition">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-3 text-slate-400 hover:text-amber-400 focus:outline-none">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <!-- Forgot Password Link -->
                <div class="text-right mt-1.5">
                    <button type="button" onclick="handleForgotPassword()" class="text-amber-400 hover:underline font-semibold text-[11px]">Forgot Password?</button>
                </div>
            </div>
            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-lg text-xs tracking-wider uppercase shadow-lg transition transform active:scale-95">
                Sign In to Dashboard
            </button>
        </form>

        <!-- 2. REGISTER FORM -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3 text-xs hidden max-h-[60vh] overflow-y-auto pr-1">
            <input type="hidden" id="regAccountType" value="business">

            <!-- Account Type Selector -->
            <div class="flex gap-2 mb-2">
                <button type="button" id="btnTypeBusiness" onclick="setAccountType('business')" class="flex-1 py-2 text-xs font-bold rounded-lg border border-amber-400 bg-amber-400 text-slate-900 transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-briefcase"></i> Business Account
                </button>
                <button type="button" id="btnTypeSelf" onclick="setAccountType('self')" class="flex-1 py-2 text-xs font-bold rounded-lg border border-slate-700 bg-slate-900 text-slate-400 hover:text-white transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-user"></i> Self Account
                </button>
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Full Name *</label>
                <input type="text" id="regName" placeholder="Ali Raza" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
            </div>

            <div id="businessNameField">
                <label class="block text-slate-300 mb-1 font-semibold">Business Name *</label>
                <input type="text" id="regBusinessName" placeholder="Prime Traders Store" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Email Address *</label>
                    <input type="email" id="regEmail" placeholder="user@example.com" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Mobile / WhatsApp No *</label>
                    <input type="text" id="regPhone" placeholder="03XXXXXXXXX" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">CNIC Number *</label>
                    <input type="text" id="regCNIC" placeholder="42101-XXXXXXX-X" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
                <div id="ntnNumField">
                    <label class="block text-slate-300 mb-1 font-semibold">NTN Number *</label>
                    <input type="text" id="regNTN" placeholder="1234567-8" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Bank Account Details (Title, IBAN, Bank)</label>
                <input type="text" id="regBank" placeholder="Meezan Bank - PK00 MEZN 0000 1234 5678" class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Password *</label>
                <input type="password" id="regPassword" placeholder="Minimum 6 characters" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
            </div>

            <!-- File Uploads -->
            <div class="border-t border-slate-800 pt-2 space-y-2">
                <p class="font-bold text-slate-400 text-[11px]">Verification Documents (PNG/JPG/PDF):</p>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 text-[10px]">CNIC Front Image</label>
                        <input type="file" id="fileCnicFront" accept="image/*,.pdf" class="w-full text-slate-400 text-[10px] bg-slate-950 p-1.5 border border-slate-700 rounded">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-[10px]">CNIC Back Image</label>
                        <input type="file" id="fileCnicBack" accept="image/*,.pdf" class="w-full text-slate-400 text-[10px] bg-slate-950 p-1.5 border border-slate-700 rounded">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div id="ntnFileField">
                        <label class="block text-slate-400 text-[10px]">NTN Certificate File</label>
                        <input type="file" id="fileNTN" accept="image/*,.pdf" class="w-full text-slate-400 text-[10px] bg-slate-950 p-1.5 border border-slate-700 rounded">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-[10px]">Bank Cheque / Proof</label>
                        <input type="file" id="fileBank" accept="image/*,.pdf" class="w-full text-slate-400 text-[10px] bg-slate-950 p-1.5 border border-slate-700 rounded">
                    </div>
                </div>
            </div>

            <button type="submit" id="regSubmitBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-lg text-xs tracking-wider uppercase shadow-lg transition mt-2">
                Create Account
            </button>
        </form>

    </div>

    <!-- Scripts -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('loginPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Tab Switcher Function
        function switchTab(tabName) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');

            if (tabName === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2 text-center text-amber-400 border-b-2 border-amber-400 focus:outline-none transition";
                tabRegister.className = "flex-1 py-2 text-center text-slate-400 hover:text-slate-200 focus:outline-none transition";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = "flex-1 py-2 text-center text-amber-400 border-b-2 border-amber-400 focus:outline-none transition";
                tabLogin.className = "flex-1 py-2 text-center text-slate-400 hover:text-slate-200 focus:outline-none transition";
            }
        }

        // Account Type Selector
        function setAccountType(type) {
            const regAccountType = document.getElementById('regAccountType');
            const btnBusiness = document.getElementById('btnTypeBusiness');
            const btnSelf = document.getElementById('btnTypeSelf');
            const businessFields = document.getElementById('businessNameField');
            const ntnNumField = document.getElementById('ntnNumField');
            const ntnFileField = document.getElementById('ntnFileField');

            regAccountType.value = type;

            if (type === 'business') {
                btnBusiness.className = "flex-1 py-2 text-xs font-bold rounded-lg border border-amber-400 bg-amber-400 text-slate-900 transition flex items-center justify-center gap-1";
                btnSelf.className = "flex-1 py-2 text-xs font-bold rounded-lg border border-slate-700 bg-slate-900 text-slate-400 hover:text-white transition flex items-center justify-center gap-1";
                if (businessFields) businessFields.style.display = 'block';
                if (ntnNumField) ntnNumField.style.display = 'block';
                if (ntnFileField) ntnFileField.style.display = 'block';
            } else {
                btnSelf.className = "flex-1 py-2 text-xs font-bold rounded-lg border border-amber-400 bg-amber-400 text-slate-900 transition flex items-center justify-center gap-1";
                btnBusiness.className = "flex-1 py-2 text-xs font-bold rounded-lg border border-slate-700 bg-slate-900 text-slate-400 hover:text-white transition flex items-center justify-center gap-1";
                if (businessFields) businessFields.style.display = 'none';
                if (ntnNumField) ntnNumField.style.display = 'none';
                if (ntnFileField) ntnFileField.style.display = 'none';
            }
        }

        // Updated Role-Based Login Routing Logic
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const pass = document.getElementById('loginPassword').value;

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, pass);
                const user = userCredential.user;

                let role = 'customer';

                // Safe role detection (Pehle email check karein taaki permission error na aaye)
                if (email.includes('admin') || email === 'admin@primetraders.com') {
                    role = 'admin';
                } else if (email.includes('rider')) {
                    role = 'rider';
                } else {
                    // Agar email se pata na chale tab Firestore se check karein
                    try {
                        const userDoc = await db.collection('users').doc(user.uid).get();
                        if (userDoc.exists && userDoc.data().role) {
                            role = userDoc.data().role.toLowerCase();
                        }
                    } catch (err) {
                        console.log("Firestore read skipped:", err);
                    }
                }

                // Role-based redirection
                if (role === 'admin') {
                    window.location.href = 'admin.html';
                } else if (role === 'rider') {
                    window.location.href = 'rider.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                alert("Login Error: " + err.message);
            }
        }
        function handleRegister(e) {
            e.preventDefault();
            alert("Registration logic triggered.");
        }

        function handleForgotPassword() {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) {
                alert("Pehle email enter karein.");
                return;
            }
            auth.sendPasswordResetEmail(email)
                .then(() => { alert("Password reset email bhej di gayi hai!"); })
                .catch(err => { alert("Error: " + err.message); });
        }
    </script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="dashboard.js?v=9.0"></script>
</body>
</html>
