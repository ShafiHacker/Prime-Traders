<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airway Bill / Shipping Label | Prime Traders</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @page { size: A6 portrait; margin: 0; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #fff; color: #000; font-size: 11px; }
        .label-card { border: 2px solid #000; width: 100%; max-width: 420px; margin: auto; box-sizing: border-box; }
        .row { display: flex; border-bottom: 1px solid #000; }
        .col { flex: 1; padding: 4px 6px; box-sizing: border-box; }
        .border-r { border-right: 1px solid #000; }
        .text-center { text-align: center; }
        .font-bold { font-weight: bold; }
        .header-title { font-size: 18px; font-weight: 900; letter-spacing: 1px; }
        .barcode-container svg { width: 100%; height: 50px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

    <div class="no-print" style="text-align: center; margin-bottom: 15px;">
        <button onclick="window.print()" style="background: #000; color: #fff; padding: 8px 20px; border: none; font-weight: bold; cursor: pointer; border-radius: 4px;">Print Label / Airway Bill</button>
    </div>

    <div class="label-card">
        <!-- Header -->
        <div class="row" style="align-items: center;">
            <div class="col border-r" style="flex: 0.8;">
                <div style="font-size: 16px; font-weight: 900;">PRIME TRADERS</div>
                <div style="font-size: 8px;">EXPRESS & LOGISTICS</div>
            </div>
            <div class="col text-center">
                <div class="header-title">OVERNIGHT</div>
                <div style="font-size: 9px; font-weight: bold;">COD PARCEL</div>
            </div>
        </div>

        <!-- COD Amount & Consignee Row -->
        <div class="row">
            <div class="col border-r" style="flex: 0.9;">
                <div class="font-bold">COD AMOUNT</div>
                <div id="lblCodAmount" style="font-size: 16px; font-weight: 900; margin-top: 4px;">PKR 0.00</div>
            </div>
            <div class="col" style="flex: 1.1;">
                <div><span class="font-bold">Consignee:</span> <span id="lblCustName">N/A</span></div>
                <div><span class="font-bold">Contact:</span> <span id="lblCustPhone">N/A</span></div>
                <div><span class="font-bold">Destination:</span> <span id="lblCustCity" style="font-size: 13px; font-weight: 900;">KARACHI</span></div>
            </div>
        </div>

        <!-- Address & Barcode Section -->
        <div class="row">
            <div class="col border-r" style="flex: 1.2;">
                <div class="font-bold" style="font-size: 9px;">DELIVERY ADDRESS:</div>
                <div id="lblCustAddress" style="font-size: 10px; height: 55px; overflow: hidden; margin-top: 2px;">Address details...</div>
            </div>
            <div class="col text-center" style="flex: 0.8;">
                <div class="barcode-container"><svg id="barcode"></svg></div>
                <div id="lblTrackId" style="font-size: 10px; font-weight: bold; font-family: monospace;">PT12345678</div>
            </div>
        </div>

        <!-- Shipper Details -->
        <div class="row" style="background: #f0f0f0;">
            <div class="col">
                <div><span class="font-bold">Shipper Name / Store:</span> <span id="lblShipperName">Prime Traders Store</span></div>
                <div><span class="font-bold">Shipper Address:</span> <span id="lblShipperAddress">Origin Business Address</span></div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const trackVal = urlParams.get('trackId') || 'PT-100001';
        document.getElementById('lblTrackId').innerText = trackVal;
        document.getElementById('lblCodAmount').innerText = 'PKR ' + (urlParams.get('cod') || '0');
        document.getElementById('lblCustName').innerText = urlParams.get('name') || 'N/A';
        document.getElementById('lblCustPhone').innerText = urlParams.get('phone') || 'N/A';
        document.getElementById('lblCustCity').innerText = (urlParams.get('city') || 'N/A').toUpperCase();
        document.getElementById('lblCustAddress').innerText = urlParams.get('address') || 'N/A';
        document.getElementById('lblShipperName').innerText = urlParams.get('shipper') || 'Prime Traders Merchant';
        document.getElementById('lblShipperAddress').innerText = urlParams.get('origin') || 'Pakistan';

        JsBarcode("#barcode", trackVal, {
            format: "CODE128", width: 1.5, height: 40, displayValue: false
        });
    </script>
</body>
</html>
