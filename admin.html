<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Prime Traders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
    function getAdminTicketsDb() {
        if (typeof db !== "undefined" && db) return db;
        if (typeof firebase !== "undefined" && firebase.apps && firebase.apps.length > 0) {
            return firebase.firestore();
        }
        return null;
    }

    function toggleAdminTicketsPanel() {
        const panel = document.getElementById("adminTicketsPanel");
        if (!panel) return;
        const isOpen = panel.style.display === "block";
        panel.style.display = isOpen ? "none" : "block";
        if (!isOpen) {
            loadAdminTicketsList();
        }
    }

    // Baqi sidebar links/buttons par click karne par tickets panel band ho jaye
    document.addEventListener("click", function (e) {
        const clickedSidebarBtn = e.target.closest("aside button, aside a, .sidebar button, .sidebar a, nav button, nav a");
        if (clickedSidebarBtn && clickedSidebarBtn.id !== "btnShowAdminTickets") {
            const panel = document.getElementById("adminTicketsPanel");
            if (panel) panel.style.display = "none";
        }
    });

    async function loadAdminTicketsList() {
        const container = document.getElementById("adminTicketsListContainer");
        const badge = document.getElementById("adminTicketsBadge");
        const firestore = getAdminTicketsDb();

        if (!container) return;
        if (!firestore) {
            container.innerHTML = '<div style="color:#f87171; font-size:12px;">Firebase Firestore not initialized.</div>';
            return;
        }

        container.innerHTML = '<div style="font-size:12px; color:#94a3b8;">Loading tickets & complaints...</div>';

        try {
            const snap = await firestore.collection("support_tickets").orderBy("createdAt", "desc").get();
            if (badge) badge.textContent = snap.size;

            if (snap.empty) {
                container.innerHTML = '<div style="font-size:12px; color:#94a3b8; padding:12px; background:#020617; border-radius:8px; border:1px solid #1e293b;">No tickets or complaints found.</div>';
                return;
            }

            let html = "";
            snap.forEach((doc) => {
                const t = doc.data();
                const docId = doc.id;
                const status = t.status || "Open";
                const isResolved = status === "Resolved";

                html += `
                    <div style="border: 1px solid #1e293b; border-left: 4px solid ${isResolved ? "#10b981" : "#f59e0b"}; border-radius: 10px; padding: 14px; background: #020617;">
                        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;">
                            <div>
                                <strong style="color:#ffffff; font-size:13px;">${t.ticketId || docId}</strong>
                                <span style="margin-left:8px; background:#1e293b; color:#fbbf24; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700;">${t.category || t.entryType || "Ticket"}</span>
                                <span style="margin-left:6px; background:${isResolved ? "rgba(16,185,129,0.2)" : "rgba(245,158,11,0.2)"}; color:${isResolved ? "#34d399" : "#fbbf24"}; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700;">${status}</span>
                            </div>
                            <div style="display:flex; gap:6px;">
                                <button type="button" onclick="setAdminTicketStatus('${docId}', '${isResolved ? "Open" : "Resolved"}')" style="background:${isResolved ? "#f59e0b" : "#10b981"}; color:${isResolved ? "#0b132b" : "#ffffff"}; border:none; padding:5px 10px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer;">
                                    ${isResolved ? "Reopen" : "Mark Resolved"}
                                </button>
                                <button type="button" onclick="removeAdminTicket('${docId}')" style="background:#ef4444; color:#ffffff; border:none; padding:5px 10px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer;">
                                    Delete
                                </button>
                            </div>
                        </div>
                        <div style="font-size:12px; color:#cbd5e1; margin-bottom:6px;">
                            <strong>Name:</strong> ${t.name || "-"} |
                            <strong>Phone:</strong> ${t.phone || "-"} |
                            <strong>Email:</strong> ${t.email || "-"}
                            ${t.orderId ? ` | <strong>Order/Tracking:</strong> ${t.orderId}` : ""}
                        </div>
                        <div style="font-size:12px; color:#f8fafc; background:#0f172a; border:1px solid #1e293b; padding:10px; border-radius:8px; white-space:pre-line;">${t.message || ""}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        } catch (err) {
            console.error("Error loading admin tickets:", err);
            container.innerHTML = `<div style="color:#f87171; font-size:12px;">Error loading records: ${err.message}</div>`;
        }
    }

    async function setAdminTicketStatus(docId, status) {
        const firestore = getAdminTicketsDb();
        if (!firestore) return;
        await firestore.collection("support_tickets").doc(docId).update({ status: status });
        loadAdminTicketsList();
    }

    async function removeAdminTicket(docId) {
        const firestore = getAdminTicketsDb();
        if (!firestore) return;
        await firestore.collection("support_tickets").doc(docId).delete();
        loadAdminTicketsList();
    }
</script>
    <script>
(function initAdminYousafPaymentSystem() {
  const COLLECTION_NAME = "yousafPayments";
  const DOC_ID = "yousafansari_ledger";

  let rowsData = [];

  function createEmptyRow() {
    return {
      id: "row_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
      referralCode: "143256",
      studentName: "",
      contact: "",
      batch: "",
      orderNo: "",
      productDescription: "",
      qty: "",
      rate: "",
      date: "",
      returnOrCharged: "",
      proofName: "",
      proofDataUrl: ""
    };
  }

  function getCommissionRateByProductRate(productRate) {
    const pRate = parseFloat(productRate);
    if (!isFinite(pRate) || pRate <= 0) return 0;
    if (pRate <= 100) return 10;
    if (pRate <= 200) return 20;
    if (pRate <= 300) return 30;
    if (pRate <= 400) return 40;
    if (pRate <= 500) return 50;
    return 80;
  }

  function calcRow(r) {
    const qty = parseFloat(r.qty) || 0;
    const rate = parseFloat(r.rate) || 0;
    const totalReceived = qty * rate;

    const commRate = getCommissionRateByProductRate(rate);
    const twoPctAdd = (commRate / 100) * 2;
    const commTotal = commRate + twoPctAdd;
    const bank2Pct = (commTotal / 100) * 2;
    const pay = commTotal - bank2Pct;

    return { totalReceived, commRate, twoPctAdd, commTotal, bank2Pct, pay };
  }

  function fmtNum(n) {
    if (!isFinite(n)) return "0";
    return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/\.?0+$/, "");
  }

  function findMainContentTarget() {
    const mainEl =
      document.querySelector("main") ||
      document.querySelector("[class*='main-content']") ||
      document.querySelector("[class*='content-area']");
    if (mainEl) return mainEl;

    const overviewHeading = Array.from(document.querySelectorAll("h1, h2, h3, div")).find((el) =>
      (el.textContent || "").trim().toUpperCase().includes("DASHBOARD OVERVIEW")
    );
    return overviewHeading ? overviewHeading.parentElement : document.body;
  }

  function ensureLedgerPanel() {
    if (document.getElementById("adminYousafPaymentPanel")) {
      return document.getElementById("adminYousafPaymentPanel");
    }

    const target = findMainContentTarget();
    const panel = document.createElement("div");
    panel.id = "adminYousafPaymentPanel";
    panel.style.cssText =
      "display:none;margin:16px 0 24px;background:#0f172a;border:1px solid #334155;border-radius:16px;padding:18px;color:#f8fafc;box-shadow:0 18px 40px rgba(0,0,0,0.55);position:relative;z-index:20;";

    panel.innerHTML = `
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;border-bottom:1px solid #1e293b;padding-bottom:12px;">
        <div>
          <h2 style="margin:0;font-size:18px;font-weight:800;color:#fbbf24;">Yousaf Ansari Payment Ledger</h2>
          <p style="margin:3px 0 0;font-size:12px;color:#94a3b8;">Referral: <strong>143256</strong> • Rate slabs: ≤100→10, ≤200→20, ≤300→30, ≤400→40, ≤500→50, &gt;500→80</p>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          <button type="button" id="addYousafRowBtn" style="background:#2563eb;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;">+ Add Line</button>
          <button type="button" id="saveYousafLedgerBtn" style="background:#16a34a;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;">Save</button>
        </div>
      </div>

      <div id="yousafSaveStatus" style="font-size:12px;margin-bottom:10px;color:#4ade80;min-height:18px;"></div>

      <div style="overflow-x:auto;border:1px solid #1e293b;border-radius:12px;">
        <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:1520px;">
          <thead>
            <tr style="background:#1e293b;color:#f8fafc;text-align:center;">
              <th colspan="4" style="padding:8px;border:1px solid #334155;">Student Details</th>
              <th colspan="5" style="padding:8px;border:1px solid #334155;">Product Details</th>
              <th colspan="5" style="padding:8px;border:1px solid #334155;">Commission</th>
              <th colspan="3" style="padding:8px;border:1px solid #334155;">Payment Status</th>
              <th style="padding:8px;border:1px solid #334155;">Action</th>
            </tr>
            <tr style="background:#0b1220;color:#cbd5e1;text-align:center;font-size:11px;">
              <th style="padding:7px;border:1px solid #1e293b;">Referral Code</th>
              <th style="padding:7px;border:1px solid #1e293b;">Student Name</th>
              <th style="padding:7px;border:1px solid #1e293b;">Contact</th>
              <th style="padding:7px;border:1px solid #1e293b;">Batch</th>
              <th style="padding:7px;border:1px solid #1e293b;">Order #</th>
              <th style="padding:7px;border:1px solid #1e293b;">Product Description</th>
              <th style="padding:7px;border:1px solid #1e293b;">Qty</th>
              <th style="padding:7px;border:1px solid #1e293b;">Rate</th>
              <th style="padding:7px;border:1px solid #1e293b;">Total Received</th>
              <th style="padding:7px;border:1px solid #1e293b;">Rate</th>
              <th style="padding:7px;border:1px solid #1e293b;">2% Add</th>
              <th style="padding:7px;border:1px solid #1e293b;">Total</th>
              <th style="padding:7px;border:1px solid #1e293b;">Bank 2%</th>
              <th style="padding:7px;border:1px solid #1e293b;">Pay</th>
              <th style="padding:7px;border:1px solid #1e293b;">Date</th>
              <th style="padding:7px;border:1px solid #1e293b;">Return / Charged</th>
              <th style="padding:7px;border:1px solid #1e293b;">Prof</th>
              <th style="padding:7px;border:1px solid #1e293b;">Save / Del</th>
            </tr>
          </thead>
          <tbody id="yousafPaymentTableBody"></tbody>
        </table>
      </div>
    `;

    target.prepend(panel);

    document.getElementById("addYousafRowBtn").addEventListener("click", () => {
      rowsData.push(createEmptyRow());
      renderTable();
    });
    document.getElementById("saveYousafLedgerBtn").addEventListener("click", saveToFirestore);

    return panel;
  }

  function inpStyle(w = "95px") {
    return `width:${w};background:#020617;color:#f8fafc;border:1px solid #334155;border-radius:6px;padding:5px 7px;font-size:12px;`;
  }

  function calcCellStyle(bg = "#131c31", color = "#fbbf24") {
    return `padding:7px 8px;border:1px solid #1e293b;background:${bg};color:${color};font-weight:700;text-align:right;white-space:nowrap;`;
  }

  function renderTable() {
    const tbody = document.getElementById("yousafPaymentTableBody");
    if (!tbody) return;
    tbody.innerHTML = "";

    if (!rowsData.length) {
      rowsData.push(createEmptyRow());
    }

    rowsData.forEach((row, idx) => {
      const c = calcRow(row);
      const tr = document.createElement("tr");
      tr.style.background = idx % 2 === 0 ? "#0f172a" : "#111b2e";

      tr.innerHTML = `
        <td style="padding:6px;border:1px solid #1e293b;"><input type="text" data-field="referralCode" data-idx="${idx}" value="${row.referralCode || "143256"}" style="${inpStyle("85px")}"></td>
        <td style="padding:6px;border:1px solid #1e293b;"><input type="text" data-field="studentName" data-idx="${idx}" value="${row.studentName || ""}" style="${inpStyle("110px")}"></td>
        <td style="padding:6px;border:1px solid #1e293b;"><input type="text" data-field="contact" data-idx="${idx}" value="${row.contact || ""}" style="${inpStyle("115px")}"></td>
        <td style="padding:6px;border:1px solid #1e293b;"><input type="text" data-field="batch" data-idx="${idx}" value="${row.batch || ""}" style="${inpStyle("70px")}"></td>
        <td style="padding:6px;border:1px solid #1e293b;"><input type="text" data-field="orderNo" data-idx="${idx}" value="${row.orderNo || ""}" style="${inpStyle("75px")}"></td>
        <td style="padding:6px;border:1px solid #1e293b;"><input type="text" data-field="productDescription" data-idx="${idx}" value="${row.productDescription || ""}" style="${inpStyle("135px")}"></td>
        <td style="padding:6px;border:1px solid #1e293b;"><input type="number" step="any" data-field="qty" data-idx="${idx}" value="${row.qty}" style="${inpStyle("65px")}"></td>
        <td style="padding:6px;border:1px solid #1e293b;"><input type="number" step="any" data-field="rate" data-idx="${idx}" value="${row.rate}" style="${inpStyle("75px")}"></td>
        <td style="${calcCellStyle("#172554", "#93c5fd")}">${fmtNum(c.totalReceived)}</td>
        <td style="${calcCellStyle("#1e293b", "#fde047")}">${fmtNum(c.commRate)}</td>
        <td style="${calcCellStyle()}">${fmtNum(c.twoPctAdd)}</td>
        <td style="${calcCellStyle("#14291e", "#86efac")}">${fmtNum(c.commTotal)}</td>
        <td style="${calcCellStyle()}">${fmtNum(c.bank2Pct)}</td>
        <td style="${calcCellStyle("#052e16", "#4ade80")}">${fmtNum(c.pay)}</td>
        <td style="padding:6px;border:1px solid #1e293b;"><input type="text" data-field="date" data-idx="${idx}" value="${row.date || ""}" style="${inpStyle("95px")}"></td>
        <td style="padding:6px;border:1px solid #1e293b;"><input type="text" data-field="returnOrCharged" data-idx="${idx}" value="${row.returnOrCharged || ""}" style="${inpStyle("105px")}"></td>
        <td style="padding:6px;border:1px solid #1e293b;white-space:nowrap;">
          <label style="display:inline-block;background:#334155;color:#fff;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:11px;">
            Attach
            <input type="file" accept="image/*,application/pdf" data-attach-idx="${idx}" style="display:none;">
          </label>
          ${row.proofDataUrl ? `<button type="button" data-view-idx="${idx}" style="background:#0284c7;color:#fff;border:none;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:11px;margin-left:4px;">View</button>` : `<span style="color:#64748b;font-size:11px;margin-left:4px;">—</span>`}
        </td>
        <td style="padding:6px;border:1px solid #1e293b;white-space:nowrap;">
          <button type="button" data-save-row-idx="${idx}" style="background:#16a34a;color:#fff;border:none;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:11px;">Save</button>
          <button type="button" data-del-idx="${idx}" style="background:#dc2626;color:#fff;border:none;padding:4px 7px;border-radius:6px;cursor:pointer;font-size:11px;margin-left:3px;">✕</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll("input[data-field]").forEach((el) => {
      el.addEventListener("input", (e) => {
        const idx = Number(e.target.dataset.idx);
        const field = e.target.dataset.field;
        rowsData[idx][field] = e.target.value;
        updateCalculatedCellsOnly();
      });
    });

    tbody.querySelectorAll("input[type='file'][data-attach-idx]").forEach((fileInput) => {
      fileInput.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const idx = Number(e.target.dataset.attachIdx);
        const reader = new FileReader();
        reader.onload = () => {
          rowsData[idx].proofName = file.name;
          rowsData[idx].proofDataUrl = reader.result;
          renderTable();
          setStatus(`Attached "${file.name}" on row ${idx + 1}. Click Save to store.`);
        };
        reader.readAsDataURL(file);
      });
    });

    tbody.querySelectorAll("button[data-view-idx]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.viewIdx);
        openSlipPreview(rowsData[idx]);
      });
    });

    tbody.querySelectorAll("button[data-save-row-idx]").forEach((btn) => {
      btn.addEventListener("click", () => {
        saveToFirestore();
      });
    });

    tbody.querySelectorAll("button[data-del-idx]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.delIdx);
        rowsData.splice(idx, 1);
        renderTable();
      });
    });
  }

  function updateCalculatedCellsOnly() {
    const tbody = document.getElementById("yousafPaymentTableBody");
    if (!tbody) return;
    const trList = tbody.querySelectorAll("tr");
    rowsData.forEach((row, idx) => {
      const tr = trList[idx];
      if (!tr) return;
      const c = calcRow(row);
      const cells = tr.querySelectorAll("td");
      if (cells[8]) cells[8].textContent = fmtNum(c.totalReceived);
      if (cells[9]) cells[9].textContent = fmtNum(c.commRate);
      if (cells[10]) cells[10].textContent = fmtNum(c.twoPctAdd);
      if (cells[11]) cells[11].textContent = fmtNum(c.commTotal);
      if (cells[12]) cells[12].textContent = fmtNum(c.bank2Pct);
      if (cells[13]) cells[13].textContent = fmtNum(c.pay);
    });
  }

  function openSlipPreview(row) {
    if (!row || !row.proofDataUrl) return;
    const win = window.open("", "_blank");
    if (!win) {
      alert("Pop-up blocked. Please allow pop-ups to view attached bank slip.");
      return;
    }
    const isPdf = row.proofDataUrl.startsWith("data:application/pdf");
    win.document.write(`
      <html><head><title>Bank Slip - ${row.studentName || "Proof"}</title></head>
      <body style="margin:0;background:#090d16;display:flex;align-items:center;justify-content:center;min-height:100vh;">
        ${isPdf
          ? `<iframe src="${row.proofDataUrl}" style="width:95vw;height:95vh;border:none;"></iframe>`
          : `<img src="${row.proofDataUrl}" style="max-width:95vw;max-height:95vh;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.6);" />`
        }
      </body>
      </html>
    `);
  }

  function setStatus(msg, isErr = false) {
    const el = document.getElementById("yousafSaveStatus");
    if (el) {
      el.textContent = msg;
      el.style.color = isErr ? "#f87171" : "#4ade80";
    }
  }

  async function loadFromFirestore() {
    try {
      if (window.db) {
        const snap = await window.db.collection(COLLECTION_NAME).doc(DOC_ID).get();
        if (snap.exists && Array.isArray(snap.data().rows)) {
          rowsData = snap.data().rows;
          renderTable();
          return;
        }
      }
    } catch (e) {
      console.warn("Firestore load fallback:", e);
    }

    const localSaved = localStorage.getItem("pt_yousaf_payment_rows");
    if (localSaved) {
      try {
        rowsData = JSON.parse(localSaved) || [];
      } catch (_) {
        rowsData = [];
      }
    }
    renderTable();
  }

  async function saveToFirestore() {
    localStorage.setItem("pt_yousaf_payment_rows", JSON.stringify(rowsData));
    try {
      if (window.db) {
        await window.db.collection(COLLECTION_NAME).doc(DOC_ID).set({
          rows: rowsData,
          updatedAt: new Date().toISOString()
        }, { merge: true });
        setStatus("Saved successfully.");
        return;
      }
    } catch (e) {
      setStatus("Save error: " + e.message, true);
      return;
    }
    setStatus("Saved locally.");
  }

  document.addEventListener("click", async (e) => {
    const paymentBtn = e.target.closest("#openYousafPaymentBtn");
    if (paymentBtn) {
      const panel = ensureLedgerPanel();
      panel.style.display = "block";
      panel.scrollIntoView({ behavior: "smooth", block: "start" });
      await loadFromFirestore();
      return;
    }

    // Auto-hide Yousaf Ledger when user clicks any other sidebar menu item
    const clickedSidebarItem = e.target.closest("aside a, aside button, nav a, nav button, [class*='sidebar'] a, [class*='sidebar'] button");
    if (clickedSidebarItem && !clickedSidebarItem.closest("#adminYousafPaymentPanel")) {
      const panel = document.getElementById("adminYousafPaymentPanel");
      if (panel) panel.style.display = "none";
    }
  });
})();
</script>

<script>
    const STUDENT_STORAGE_KEYS = ['studentRegistrations', 'students', 'studentData', 'registeredStudents', 'users'];

    function findStudentsStorageKey() {
        for (const key of STUDENT_STORAGE_KEYS) {
            const raw = localStorage.getItem(key);
            if (!raw) continue;
            try {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed) && parsed.length > 0) return key;
                if (parsed && typeof parsed === 'object') return key;
            } catch (_) {}
        }
        return 'studentRegistrations';
    }

    function extractStudentCnicImages(student) {
        const imgs = [];
        if (!student || typeof student !== 'object') return imgs;

        const keysToCheck = [
            'cnicFront', 'cnicBack', 'cnicImage', 'cnicUrl', 'cnicPhoto',
            'cnicImg', 'frontImage', 'backImage', 'documentUrl', 'docUrl',
            'idCardUrl', 'imageUrl', 'photoUrl', 'attachmentUrl', 'proofUrl'
        ];

        function pushValid(val, label) {
            if (!val) return;
            if (typeof val === 'string') {
                const t = val.trim();
                if (t.startsWith('data:image/') || t.startsWith('http://') || t.startsWith('https://')) {
                    if (!imgs.some((x) => x.url === t)) imgs.push({ label, url: t });
                }
            } else if (typeof val === 'object') {
                const u = val.url || val.dataUrl || val.src || val.downloadUrl || '';
                if (typeof u === 'string' && (u.startsWith('data:image/') || u.startsWith('http://') || u.startsWith('https://'))) {
                    if (!imgs.some((x) => x.url === u)) imgs.push({ label: val.name || label, url: u });
                }
            }
        }

        keysToCheck.forEach((k) => {
            if (k in student) pushValid(student[k], k);
        });

        if (Array.isArray(student.documents)) {
            student.documents.forEach((d, idx) => pushValid(d, `Document ${idx + 1}`));
        }
        if (Array.isArray(student.images)) {
            student.images.forEach((d, idx) => pushValid(d, `Image ${idx + 1}`));
        }

        Object.entries(student).forEach(([k, v]) => {
            if (/cnic|card|doc|img|photo|id/i.test(k)) {
                pushValid(v, k);
            }
        });

        return imgs;
    }

    <script>
(function applyPrimeTradersAdminUpdates() {
  const KEEP_METRIC_TITLES = [
    "total shipments",
    "active users",
    "deleted archive",
    "wholeseller orders",
    "reseller portal",
    "e-commerce student portal",
    "tickets & complaints",
    "commission",
    "yousaf ansari payment"
  ];

  const REMOVE_CARD_TITLES = [
    "in transit",
    "delivered today",
    "failed deliveries",
    "pending approval",
    "top riders today",
    "pending deliveries",
    "recent bookings",
    "today's revenue",
    "todays revenue"
  ];

  function renamePortalLabels() {
    document.querySelectorAll("a, button, span, h1, h2, h3, h4, p, div, li").forEach((el) => {
      if (el.children.length > 0) return;
      const txt = (el.textContent || "").trim();
      if (/^e-?commerce student portal$/i.test(txt)) {
        el.textContent = txt.replace(/e-?commerce student portal/i, "Reseller Portal");
      }
    });
  }

  function removeUnwantedMenusAndButtons() {
    document.querySelectorAll("a, button, div, li, span").forEach((el) => {
      const txt = (el.textContent || "").trim().toLowerCase();
      if (!txt) return;

      if (
        txt === "daily petrol rate" ||
        txt === "dc km settings" ||
        txt === "manual parcel entry"
      ) {
        const container = el.closest("li, a, button") || el;
        container.remove();
      }
    });

    // Remove legacy petrol / dc km panels if present
    document.querySelectorAll("[id*='petrol' i], [id*='dckm' i], [id*='dc-km' i], [id*='manualParcel' i]").forEach((node) => {
      if (node.tagName !== "BODY" && node.tagName !== "HTML") {
        node.remove();
      }
    });
  }

  function moveTopActionsToSidebarMenu() {
    const sidebar =
      document.querySelector("aside nav") ||
      document.querySelector("aside ul") ||
      document.querySelector("aside") ||
      document.querySelector("[class*='sidebar']");
    if (!sidebar) return;

    let menuGroup = document.getElementById("ptMovedMenuActions");
    if (!menuGroup) {
      menuGroup = document.createElement("div");
      menuGroup.id = "ptMovedMenuActions";
      menuGroup.style.cssText = "display:flex;flex-direction:column;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(148,163,184,0.18);";
      sidebar.appendChild(menuGroup);
    }

    const allBtns = Array.from(document.querySelectorAll("button, a"));
    const editBtn = allBtns.find((b) => (b.textContent || "").trim().toLowerCase() === "edit profile");
    const newShipBtn = allBtns.find((b) => (b.textContent || "").trim().replace(/^\+\s*/, "").toLowerCase() === "new shipment");

    [editBtn, newShipBtn].forEach((btn) => {
      if (!btn) return;
      if (btn.parentElement === menuGroup) return;
      btn.classList.add("w-full", "justify-start", "text-left");
      menuGroup.appendChild(btn);
    });
  }

  function cleanOverviewCardsAndAddRequestedBoxes() {
    // Remove unwanted cards/sections on overview
    document.querySelectorAll("section, div, article").forEach((card) => {
      const heading = card.querySelector("h1, h2, h3, h4, p, span");
      if (!heading) return;
      const titleText = (heading.textContent || "").trim().toLowerCase();
      if (!titleText) return;

      const isUnwanted = REMOVE_CARD_TITLES.some((k) => titleText === k || titleText.startsWith(k + " "));
      if (isUnwanted && card.getBoundingClientRect().width > 120 && card.getBoundingClientRect().height > 60) {
        card.remove();
      }
    });

    const overviewContainer =
      document.getElementById("overviewCardsGrid") ||
      Array.from(document.querySelectorAll("div")).find((d) => {
        const t = (d.textContent || "").toLowerCase();
        return t.includes("total shipments") && t.includes("active users");
      });

    if (!overviewContainer) return;

    const existingTitles = Array.from(overviewContainer.querySelectorAll("h1, h2, h3, h4, p, span")).map((el) =>
      (el.textContent || "").trim().toLowerCase()
    );

    const requiredBoxes = [
      { key: "wholeseller orders", title: "Wholeseller Orders", accent: "#38bdf8", count: "0" },
      { key: "reseller portal", title: "Reseller Portal", accent: "#a855f7", count: "0" },
      { key: "tickets & complaints", title: "Tickets & Complaints", accent: "#f59e0b", count: "0" },
      { key: "commission", title: "Commission", accent: "#4ade80", count: "0" }
    ];

    requiredBoxes.forEach((box) => {
      const alreadyExists = existingTitles.some((t) => t === box.key);
      if (alreadyExists) return;

      const card = document.createElement("div");
      card.setAttribute("data-pt-overview-card", box.key);
      card.style.cssText =
        "background:#0b1220;border:1px solid #1e293b;border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;min-height:110px;";
      card.innerHTML = `
        <div style="font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:#94a3b8;">${box.title}</div>
        <div id="ptCardVal_${box.key.replace(/[^a-z0-9]/gi, "_")}" style="font-size:26px;font-weight:900;color:${box.accent};margin-top:8px;">${box.count}</div>
      `;
      overviewContainer.appendChild(card);
    });
  }

  function syncParcelActivityWithShipments() {
    const parcelSection = Array.from(document.querySelectorAll("div, section")).find((el) =>
      (el.textContent || "").toUpperCase().includes("PARCEL ACTIVITY") &&
      (el.textContent || "").toLowerCase().includes("mon") &&
      (el.textContent || "").toLowerCase().includes("sun")
    );
    if (!parcelSection) return;

    // Pull shipments from localStorage/window if available
    let shipments = [];
    if (Array.isArray(window.shipmentsData)) {
      shipments = window.shipmentsData;
    } else {
      for (const k of ["shipments", "parcels", "bookings", "orders"]) {
        try {
          const parsed = JSON.parse(localStorage.getItem(k) || "[]");
          if (Array.isArray(parsed) && parsed.length) {
            shipments = parsed;
            break;
          }
        } catch (_) {}
      }
    }

    const dayBuckets = { Mon: 0, Tue: 0, Wed: 0, Thu: 0, Fri: 0, Sat: 0, Sun: 0 };
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    shipments.forEach((s) => {
      const rawDate = s.date || s.createdAt || s.bookingDate || s.timestamp;
      let d = rawDate ? new Date(rawDate) : new Date();
      if (isNaN(d.getTime())) d = new Date();
      const dayLabel = dayNames[d.getDay()] || "Sun";
      dayBuckets[dayLabel] = (dayBuckets[dayLabel] || 0) + 1;
    });

    const totalCount = shipments.length;
    const maxVal = Math.max(1, ...Object.values(dayBuckets));

    // Update bar heights if bar elements exist near Mon-Sun labels
    Object.entries(dayBuckets).forEach(([day, count]) => {
      const labelEl = Array.from(parcelSection.querySelectorAll("span, div, p")).find(
        (n) => n.children.length === 0 && (n.textContent || "").trim() === day
      );
      if (!labelEl) return;
      const bar = labelEl.previousElementSibling || labelEl.parentElement?.querySelector("[style*='height']");
      if (bar && bar !== labelEl) {
        const pct = totalCount > 0 ? Math.max(12, Math.round((count / maxVal) * 100)) : 12;
        bar.style.height = pct + "%";
        bar.title = `${day}: ${count} shipments`;
      }
    });

    // Update Total Volume text if present
    Array.from(parcelSection.querySelectorAll("div, p, span")).forEach((el) => {
      if (el.children.length === 0 && /parcels$/i.test((el.textContent || "").trim())) {
        el.textContent = `${totalCount} parcels`;
      }
    });
  }

  function runAllUpdates() {
    renamePortalLabels();
    removeUnwantedMenusAndButtons();
    moveTopActionsToSidebarMenu();
    cleanOverviewCardsAndAddRequestedBoxes();
    syncParcelActivityWithShipments();
  }

  document.addEventListener("DOMContentLoaded", runAllUpdates);
  setTimeout(runAllUpdates, 300);

  const observer = new MutationObserver(() => {
    clearTimeout(window.__ptUpdateTimer);
    window.__ptUpdateTimer = setTimeout(runAllUpdates, 120);
  });
  if (document.body) {
    observer.observe(document.body, { childList: true, subtree: true });
  }
})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="dashboard.js?v=16.0"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Clean text formatting
        const descEls = document.querySelectorAll('p');
        descEls.forEach(el => {
            if (el.innerHTML.includes('[cite:')) {
                el.innerHTML = el.innerHTML.replace(/\[cite:[^\]]*\]/g, '');
            }
        });

        loadAdminStudentRequests();
    });

    async function loadAdminStudentRequests() {
        const tableBody = document.getElementById('adminStudentsTableBody');
        if (!tableBody) return;

        tableBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400 font-semibold">Fetching student registrations from Firebase...</td></tr>`;

        try {
            const snapshot = await db.collection('students').orderBy('createdAt', 'desc').get();

            if (snapshot.empty) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400 font-semibold">No student registration requests found in database.</td></tr>`;
                return;
            }

            let html = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                const docId = doc.id;

                let statusBadge = '';
                if (data.status === 'approved') {
                    statusBadge = `<span class="px-3 py-1 bg-emerald-950 text-emerald-400 border border-emerald-500/40 rounded-full text-xs font-bold uppercase">Approved</span>`;
                } else if (data.status === 'rejected') {
                    statusBadge = `<span class="px-3 py-1 bg-rose-950 text-rose-400 border border-rose-500/40 rounded-full text-xs font-bold uppercase">Rejected</span>`;
                } else {
                    statusBadge = `<span class="px-3 py-1 bg-amber-950 text-amber-400 border border-amber-500/40 rounded-full text-xs font-bold uppercase">Pending</span>`;
                }

                let cnicImg = data.cnicImage || data.cnicFrontUrl || data.cnicPic || data.cnicURL || '';
                let bankImg = data.bankImage || data.bankReceiptUrl || data.bankSlip || data.bankURL || '';

                let docsButtons = `<div class="flex items-center gap-2 mt-2">`;
                if (cnicImg) {
                    docsButtons += `<a href="${cnicImg}" target="_blank" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 hover:bg-amber-500/20 px-2.5 py-1 rounded-lg text-[11px] font-bold transition flex items-center gap-1"><i class="fa-solid fa-id-card"></i> CNIC Doc</a>`;
                }
                if (bankImg) {
                    docsButtons += `<a href="${bankImg}" target="_blank" class="bg-blue-500/10 text-blue-400 border border-blue-500/30 hover:bg-blue-500/20 px-2.5 py-1 rounded-lg text-[11px] font-bold transition flex items-center gap-1"><i class="fa-solid fa-receipt"></i> Bank Slip</a>`;
                }
                if (!cnicImg && !bankImg) {
                    docsButtons += `<span class="text-slate-500 text-[11px]">No Documents Uploaded</span>`;
                }
                docsButtons += `</div>`;

                html += `
                    <tr class="border-b border-slate-800 hover:bg-slate-900/50 transition">
                        <td class="p-4">
                            <p class="font-bold text-white text-sm">${data.fullName || 'N/A'}</p>
                            <p class="text-amber-400 font-semibold text-xs mt-0.5">${data.businessName || 'N/A'}</p>
                        </td>
                        <td class="p-4">
                            <p class="text-slate-300 text-xs">${data.email || 'N/A'}</p>
                            <p class="text-slate-400 text-[11px] mt-0.5">${data.phone || 'N/A'}</p>
                        </td>
                        <td class="p-4">
                            <p class="text-slate-300 text-xs font-bold">${data.cnic || 'N/A'}</p>
                            <p class="text-purple-300 font-semibold text-[11px] mt-0.5">Batch: ${data.batchNo || 'N/A'}</p>
                        </td>
                        <td class="p-4">
                            <p class="text-slate-300 text-xs">${data.bankDetails || 'N/A'}</p>
                            ${docsButtons}
                        </td>
                        <td class="p-4">
                            ${statusBadge}
                        </td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="adminVerifyStudent('${docId}', 'approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-bold shadow transition">
                                <i class="fa-solid fa-check mr-1"></i> Approve
                            </button>
                            <button onclick="adminVerifyStudent('${docId}', 'rejected')" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-xl text-xs font-bold shadow transition">
                                <i class="fa-solid fa-xmark mr-1"></i> Reject
                            </button>
                        </td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
        } catch (err) {
            console.error("Error loading students:", err);
            tableBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-rose-400 font-semibold">Error loading data: ${err.message}</td></tr>`;
        }
    }

    window.adminVerifyStudent = async function(docId, newStatus) {
        try {
            const studentRef = db.collection('students').doc(docId);
            await studentRef.update({
                status: newStatus
            });

            alert("Student status updated successfully!");
            loadAdminStudentRequests();
        } catch (err) {
            console.error("Update error:", err);
            try {
                await db.collection('students').doc(docId).set({
                    status: newStatus
                }, { merge: true });
                alert("Student status updated successfully!");
                loadAdminStudentRequests();
            } catch (innerErr) {
                alert("Status update failed: " + innerErr.message);
            }
        }
    };
    <script>
