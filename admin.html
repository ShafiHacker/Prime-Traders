<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Prime Traders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b1329] text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Bar Navigation -->
    <header class="bg-[#0f172a] border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-purple-600 text-white font-black text-xl w-10 h-10 flex items-center justify-center rounded-xl shadow-lg">A</div>
                <div>
                    <h1 class="text-base font-black tracking-wider uppercase text-white">PRIME TRADERS</h1>
                    <p class="text-[10px] text-purple-400 font-bold uppercase tracking-widest">ADMIN CONTROL PANEL</p>
                </div>
            </div>

            <div class="flex items-center gap-3 text-xs">
                <span class="text-slate-400 font-bold">Admin</span>
                <button class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition">
                    <i class="fa-solid fa-user-pen mr-1"></i> Edit Profile
                </button>
                <button onclick="logoutAdmin()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-3 py-1.5 rounded-lg transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Admin Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- Top Original Stat Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-[#111c38] border border-slate-800/80 p-4 rounded-xl shadow-lg">
                <span class="text-[11px] font-bold text-slate-400 uppercase">Total Shipments</span>
                <div id="statTotalShipments" class="text-3xl font-black text-white mt-2">0</div>
            </div>
            <div class="bg-[#111c38] border border-slate-800/80 p-4 rounded-xl shadow-lg">
                <span class="text-[11px] font-bold text-amber-400 uppercase">Active Users</span>
                <div id="statActiveUsers" class="text-3xl font-black text-amber-400 mt-2">0</div>
            </div>
            <div class="bg-[#111c38] border border-slate-800/80 p-4 rounded-xl shadow-lg">
                <span class="text-[11px] font-bold text-rose-400 uppercase">Deleted Users Archive</span>
                <div id="statDeletedUsers" class="text-3xl font-black text-rose-400 mt-2">0</div>
            </div>
            <div class="bg-[#111c38] border border-slate-800/80 p-4 rounded-xl shadow-lg">
                <span class="text-[11px] font-bold text-sky-400 uppercase">Pending Approval</span>
                <div id="statPendingApproval" class="text-3xl font-black text-sky-400 mt-2">0</div>
            </div>
        </div>

        <!-- Original Action Control Buttons Grid + Wholeseller Button -->
        <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
            <!-- Left Action Buttons -->
            <div class="flex flex-wrap items-center gap-2 text-xs">
                <button class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg transition shadow">
                    <i class="fa-solid fa-users mr-1"></i> Registered Active Users
                </button>
                <button class="bg-rose-950/80 border border-rose-800 hover:bg-rose-900 text-rose-300 font-bold px-4 py-2 rounded-lg transition">
                    <i class="fa-solid fa-box-archive mr-1"></i> Deleted Users Archive
                </button>
                <button class="bg-sky-950/80 border border-sky-800 hover:bg-sky-900 text-sky-300 font-bold px-4 py-2 rounded-lg transition">
                    <i class="fa-solid fa-truck-fast mr-1"></i> Shipment Tracking Details
                </button>
            </div>

            <!-- Right Action Buttons -->
            <div class="flex flex-wrap items-center gap-2 text-xs">
                <button class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-4 py-2 rounded-lg transition shadow">
                    <i class="fa-solid fa-barcode mr-1"></i> + Upload Tracking IDs Pool
                </button>
                <button class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg transition shadow">
                    <i class="fa-solid fa-circle-plus mr-1"></i> + Manual Parcel Entry
                </button>
                <!-- Added Wholeseller Button next to original buttons -->
                <a href="admin-catalog.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-black px-4 py-2 rounded-lg transition shadow flex items-center gap-1.5">
                    <i class="fa-solid fa-store"></i> + Wholeseller Orders
                </a>
            </div>
        </div>

        <!-- Main Tracking Details Table Container -->
        <div class="bg-[#111c38] border border-slate-800 rounded-xl shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-800/80">
                <h2 class="text-sm font-bold text-sky-400">Shipment & Parcel Tracking Details</h2>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-200">
                    <thead class="bg-[#0d152a] text-[11px] text-slate-400 font-semibold border-b border-slate-800">
                        <tr>
                            <th class="p-3">Tracking ID</th>
                            <th class="p-3">Customer Details</th>
                            <th class="p-3">Destination City & Address</th>
                            <th class="p-3">COD Amount</th>
                            <th class="p-3">Status</th>
                            <th class="p-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="shipmentsTableBody" class="divide-y divide-slate-800/60 font-medium">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-500">Loading tracking data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCRkKoE48FjYIjYfUNFEYzcxNueKUm6YOM",
          authDomain: "prime-traders-f3eec.firebaseapp.com",
          projectId: "prime-traders-f3eec",
          storageBucket: "prime-traders-f3eec.firebasestorage.app",
          messagingSenderId: "499740236001",
          appId: "1:499740236001:web:e623dfe11f6f96df22ffa0",
          measurementId: "G-6CGVKBZFJK"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function listenToShipments() {
            db.collection('parcels').onSnapshot(snapshot => {
                let total = 0, pending = 0;
                let html = '';

                snapshot.forEach(doc => {
                    const p = doc.data();
                    const docId = doc.id;
                    total++;

                    const trackId = p.trackingId || docId;
                    const cDetails = p.customerDetails || `${p.customerName || 'N/A'}\n${p.customerPhone || ''}`;
                    const cCity = p.destinationCity || p.city || 'Karachi';
                    const cAddr = p.destinationAddress || p.address || 'N/A';
                    const cod = p.codAmount !== undefined ? p.codAmount : (p.totalAmount || 0);
                    const status = p.status || 'Pending';

                    if (status === 'Pending') pending++;

                    let statusBadge = 'bg-amber-950/60 text-amber-400 border-amber-500/30';
                    if (status === 'Delivered') statusBadge = 'bg-emerald-950/60 text-emerald-400 border-emerald-500/30';
                    else if (status.includes('Transit') || status.includes('Way')) statusBadge = 'bg-sky-950/60 text-sky-400 border-sky-500/30';

                    html += `
                        <tr class="hover:bg-slate-900/40 transition">
                            <td class="p-3 font-bold text-amber-400 font-mono">${trackId}</td>
                            <td class="p-3 font-bold text-white whitespace-pre-line">${cDetails}</td>
                            <td class="p-3">
                                <div class="font-bold text-slate-200">${cCity}</div>
                                <div class="text-[10px] text-slate-400 max-w-xs truncate">${cAddr}</div>
                            </td>
                            <td class="p-3 font-black text-amber-300">PKR ${cod}</td>
                            <td class="p-3">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${statusBadge}">${status}</span>
                            </td>
                            <td class="p-3 text-right space-x-1">
                                ${status === 'Pending' ? `
                                    <button onclick="assignRider('${docId}', 'Rider Korangi Section')" class="bg-purple-600 hover:bg-purple-700 text-white text-[10px] font-bold px-2 py-1 rounded shadow">
                                        Approve -> Rider (Korangi)
                                    </button>
                                    <button onclick="assignRider('${docId}', 'Rider Shah-e-Faisal Section')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-bold px-2 py-1 rounded shadow">
                                        Approve -> Rider (Shah-e-Faisal)
                                    </button>
                                ` : `<span class="text-[10px] text-emerald-400 font-bold mr-2">Assigned: ${p.assignedRider || 'Rider'}</span>`}
                                <button onclick="deleteShipment('${docId}')" class="bg-rose-600 hover:bg-rose-700 text-white text-[10px] font-bold px-2 py-1 rounded">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('statTotalShipments').innerText = total;
                document.getElementById('statPendingApproval').innerText = pending;

                const tbody = document.getElementById('shipmentsTableBody');
                tbody.innerHTML = html || `<tr><td colspan="6" class="p-8 text-center text-slate-500">No shipments found.</td></tr>`;
            }, err => {
                console.error("Firestore Error:", err);
            });
        }

        async function assignRider(id, riderName) {
            try {
                await db.collection('parcels').doc(id).update({
                    status: `Approved / In Transit (${riderName})`,
                    assignedRider: riderName
                });
            } catch (e) {
                alert("Error assigning rider: " + e.message);
            }
        }

        async function deleteShipment(id) {
            if (confirm("Are you sure you want to delete this shipment?")) {
                try {
                    await db.collection('parcels').doc(id).delete();
                } catch(e) {
                    alert("Error deleting shipment: " + e.message);
                }
            }
        }

        function logoutAdmin() {
            firebase.auth().signOut().then(() => window.location.href = 'login.html');
        }

        window.onload = () => listenToShipments();
    </script>
</body>
</html>
