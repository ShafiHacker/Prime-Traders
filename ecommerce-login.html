<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student E-Commerce Portal | Prime Traders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .bg-custom-fit {
            background-image: url('bg-login.png');
            background-size: 100% 100%;
            background-position: center center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-custom-fit min-h-screen w-full flex items-center justify-center p-4 relative">

    <!-- Top Left Home Button -->
    <a href="index.html" class="absolute top-4 left-4 md:top-6 md:left-6 bg-slate-900/90 hover:bg-amber-500 text-slate-200 hover:text-slate-950 border border-slate-700/80 hover:border-amber-400 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-xl backdrop-blur-md z-50">
        <i class="fa-solid fa-house"></i> Home
    </a>

    <!-- Auth Container Box -->
    <div class="bg-slate-900/95 border border-slate-700/80 p-6 md:p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-5 text-slate-100 backdrop-blur-md my-auto">
        
        <!-- Logo Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex bg-amber-500 text-slate-950 font-black text-2xl w-12 h-12 items-center justify-center rounded-xl shadow-lg mb-1">P</div>
            <h1 class="text-xl font-black tracking-wider text-white uppercase">PRIME TRADERS</h1>
            <p class="text-[11px] text-amber-400 tracking-widest font-semibold uppercase">E-Commerce Student Portal</p>
        </div>

        <!-- Alert / Error Message -->
        <div id="authMsg" class="hidden p-3 bg-rose-950/80 border border-rose-500/50 text-rose-300 text-xs rounded-lg text-center font-medium"></div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-700 text-sm font-bold">
            <button id="tabStudentLogin" onclick="switchStudentTab('login')" class="flex-1 py-2 text-center text-amber-400 border-b-2 border-amber-400 focus:outline-none transition">Student Login</button>
            <button id="tabStudentRegister" onclick="switchStudentTab('register')" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-200 focus:outline-none transition">Register Student</button>
        </div>

        <!-- 1. STUDENT LOGIN FORM -->
        <form id="studentLoginForm" onsubmit="handleStudentLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Email Address</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3 top-3 text-slate-500"></i>
                    <input type="email" id="studentLoginEmail" placeholder="yousafansari@primetraders.com" required class="w-full pl-9 p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400 transition">
                </div>
            </div>
            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-500"></i>
                    <input type="password" id="studentLoginPassword" placeholder="••••••••" required class="w-full pl-9 pr-10 p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400 transition">
                    <button type="button" onclick="toggleStudentPassword()" class="absolute right-3 top-3 text-slate-400 hover:text-amber-400 focus:outline-none">
                        <i id="eyeIconStudent" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <!-- Forgot Password Link -->
                <div class="text-right mt-1.5">
                    <button type="button" onclick="handleForgotPassword()" class="text-amber-400 hover:underline font-semibold text-[11px]">Forgot Password?</button>
                </div>
            </div>
            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-lg text-xs tracking-wider uppercase shadow-lg transition transform active:scale-95">
                Sign In to Student Dashboard
            </button>
        </form>

        <!-- 2. STUDENT REGISTER FORM -->
        <form id="studentRegisterForm" onsubmit="handleStudentRegister(event)" class="space-y-3 text-xs hidden max-h-[60vh] overflow-y-auto pr-1">
            
            <div class="w-full py-2 bg-amber-400 text-slate-900 rounded-lg font-bold flex flex-col items-center justify-center text-center mb-2">
                <span class="flex items-center gap-1"><i class="fa-solid fa-user-graduate"></i> Yousaf Ansari</span>
                <span class="text-[10px] text-slate-800 font-semibold">(Student Program)</span>
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Full Name *</label>
                <input type="text" id="regStudentName" placeholder="Ali Raza" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Business / Name *</label>
                <input type="text" id="regStudentBusinessName" placeholder="Prime Traders Store" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Email Address *</label>
                    <input type="email" id="regStudentEmail" placeholder="student@example.com" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Mobile / WhatsApp No *</label>
                    <input type="text" id="regStudentPhone" placeholder="03XXXXXXXXX" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">CNIC Number *</label>
                    <input type="text" id="regStudentCNIC" placeholder="42101-XXXXXXX-X" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Batch No (Optional)</label>
                    <input type="text" id="regStudentBatchNo" placeholder="Batch-001" class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Bank Account Details (Title, IBAN, Bank)</label>
                <input type="text" id="regStudentBank" placeholder="Meezan Bank - PK00 MEZN 0000 1234 5678" class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Password *</label>
                <input type="password" id="regStudentPassword" placeholder="Minimum 6 characters" required class="w-full p-2.5 bg-slate-950/90 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
            </div>

            <!-- File Uploads -->
            <div class="border-t border-slate-800 pt-2 space-y-2">
                <p class="font-bold text-slate-400 text-[11px]">Verification Documents (PNG/JPG/PDF):</p>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 text-[10px]">CNIC Front Image</label>
                        <input type="file" id="fileStudentCnicFront" accept="image/*,.pdf" class="w-full text-slate-400 text-[10px] bg-slate-950 p-1.5 border border-slate-700 rounded">
                    </div>
                    <div>
                        <label class="block text-slate-400 text-[10px]">CNIC Back Image</label>
                        <input type="file" id="fileStudentCnicBack" accept="image/*,.pdf" class="w-full text-slate-400 text-[10px] bg-slate-950 p-1.5 border border-slate-700 rounded">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 text-[10px]">Bank Cheque / Proof / Account Details</label>
                    <input type="file" id="fileStudentBank" accept="image/*,.pdf" class="w-full text-slate-400 text-[10px] bg-slate-950 p-1.5 border border-slate-700 rounded">
                </div>
            </div>

            <button type="submit" id="regStudentSubmitBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-lg text-xs tracking-wider uppercase shadow-lg transition mt-2">
                Create Student Account
            </button>
        </form>

    </div>

    <!-- Scripts -->
    <script>
        function toggleStudentPassword() {
            const passwordInput = document.getElementById('studentLoginPassword');
            const eyeIcon = document.getElementById('eyeIconStudent');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Tab Switcher Function
        function switchStudentTab(tabName) {
            const loginForm = document.getElementById('studentLoginForm');
            const registerForm = document.getElementById('studentRegisterForm');
            const tabLogin = document.getElementById('tabStudentLogin');
            const tabRegister = document.getElementById('tabStudentRegister');

            if (tabName === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2 text-center text-amber-400 border-b-2 border-amber-400 focus:outline-none transition";
                tabRegister.className = "flex-1 py-2 text-center text-slate-400 hover:text-slate-200 focus:outline-none transition";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = "flex-1 py-2 text-center text-amber-400 border-b-2 border-amber-400 focus:outline-none transition";
                tabLogin.className = "flex-1 py-2 text-center text-slate-400 hover:text-slate-200 focus:outline-none transition";
            }
        }

        // Student Login Logic with Approval Verification Check
        async function handleStudentLogin(e) {
            e.preventDefault();
            const email = document.getElementById('studentLoginEmail').value.trim().toLowerCase();
            const pass = document.getElementById('studentLoginPassword').value;

            try {
                // Admin / Yousaf Ansari direct login check
                if (email === 'yousafansari@primetraders.com') {
                    await auth.signInWithEmailAndPassword(email, pass);
                    window.location.href = 'ecommerce-dashboard.html';
                    return;
                }

                const userCredential = await auth.signInWithEmailAndPassword(email, pass);
                const user = userCredential.user;

                // Check Firestore approval status
                const userDoc = await db.collection('students').doc(user.uid).get();
                if (userDoc.exists) {
                    const data = userDoc.data();
                    if (data.status !== 'approved') {
                        await auth.signOut();
                        alert("Aapka data verification par hai. Approval ke baad aapko WhatsApp ya Email par inform kar diya jayega.");
                        return;
                    }
                }

                window.location.href = 'ecommerce-dashboard.html';
            } catch (err) {
                alert("Login Error: " + err.message);
            }
        }

        // Student Registration Logic
        async function handleStudentRegister(e) {
            e.preventDefault();
            const email = document.getElementById('regStudentEmail').value.trim().toLowerCase();
            const password = document.getElementById('regStudentPassword').value;
            const fullName = document.getElementById('regStudentName').value;
            const businessName = document.getElementById('regStudentBusinessName').value;
            const phone = document.getElementById('regStudentPhone').value;
            const cnic = document.getElementById('regStudentCNIC').value;
            const batchNo = document.getElementById('regStudentBatchNo').value;
            const bank = document.getElementById('regStudentBank').value;

            try {
                const userCred = await auth.createUserWithEmailAndPassword(email, password);
                const uid = userCred.user.uid;

                // Save to Firestore 'students' collection with 'pending' status
                await db.collection('students').doc(uid).set({
                    uid: uid,
                    fullName: fullName,
                    businessName: businessName,
                    email: email,
                    phone: phone,
                    cnic: cnic,
                    batchNo: batchNo || 'N/A',
                    bankDetails: bank,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Student account successfully register ho gaya hai! Verification ke baad approval mil jayegi.");
                switchStudentTab('login');
            } catch (err) {
                alert("Registration Error: " + err.message);
            }
        }

        function handleForgotPassword() {
            const email = document.getElementById('studentLoginEmail').value.trim();
            if (!email) {
                alert("Pehle email enter karein.");
                return;
            }
            auth.sendPasswordResetEmail(email)
                .then(() => { alert("Password reset email bhej di gayi hai!"); })
                .catch(err => { alert("Error: " + err.message); });
        }
    </script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="dashboard.js?v=14.0"></script>
</body>
</html>
