<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | Prime Traders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <!-- Header Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-slate-900 font-black text-2xl w-10 h-10 flex items-center justify-center rounded-lg shadow-md">P</div>
                <div>
                    <h1 class="text-base font-bold tracking-wider text-white uppercase">PRIME TRADERS</h1>
                    <p class="text-[10px] text-amber-400 tracking-widest uppercase">Merchant Portal</p>
                </div>
            </div>

            <!-- Profile & Logout Buttons -->
            <div class="flex items-center gap-3">
                <span id="userNameDisplay" class="text-xs font-bold text-slate-300 hidden md:inline-block">Loading...</span>
                
                <!-- Edit Profile Button -->
                <button onclick="openProfileModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
                    <i class="fa-solid fa-user-pen"></i> Edit Profile
                </button>

                <button onclick="handleLogout()" class="bg-rose-600/20 text-rose-400 border border-rose-500/30 hover:bg-rose-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        <!-- Stats Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow">
                <p class="text-xs text-slate-400">Total Bookings</p>
                <h3 id="cardTotal" class="text-2xl font-bold text-white mt-1">0</h3>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow">
                <p class="text-xs text-amber-400">Pending</p>
                <h3 id="cardPending" class="text-2xl font-bold text-amber-400 mt-1">0</h3>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow">
                <p class="text-xs text-blue-400">In Transit</p>
                <h3 id="cardInTransit" class="text-2xl font-bold text-blue-400 mt-1">0</h3>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl shadow">
                <p class="text-xs text-emerald-400">Delivered</p>
                <h3 id="cardDelivered" class="text-2xl font-bold text-emerald-400 mt-1">0</h3>
            </div>
        </div>

        <!-- Parcel Booking Table -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow">
            <div class="p-4 border-b border-slate-700 font-bold text-sm text-white flex justify-between items-center">
                <span>Recent Shipments</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-900 text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="p-3">Track ID</th>
                            <th class="p-3">Customer</th>
                            <th class="p-3">City</th>
                            <th class="p-3">COD Amount</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="userParcelTable">
                        <tr><td colspan="5" class="p-4 text-center text-slate-400">Loading parcels...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Profile Edit Modal -->
    <div id="profileModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-md w-full space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-base font-bold text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-user-gear"></i> Edit Profile & Business Info
                </h3>
                <button onclick="closeProfileModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form onsubmit="saveProfileUpdate(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Full Name</label>
                    <input type="text" id="editName" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Business Name</label>
                    <input type="text" id="editBusinessName" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Mobile / WhatsApp No</label>
                    <input type="text" id="editPhone" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Business Address</label>
                    <input type="text" id="editAddress" placeholder="Enter complete office/store address" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1 font-semibold">Business Logo / Profile Picture</label>
                    <input type="file" id="editLogoFile" accept="image/*" class="w-full text-slate-400 text-xs bg-slate-900 p-2 border border-slate-700 rounded-lg">
                </div>

                <div class="flex gap-2 justify-end pt-3 border-t border-slate-700">
                    <button type="button" onclick="closeProfileModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold rounded-lg shadow">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="dashboard.js?v=5.0"></script>
</body>
</html>
