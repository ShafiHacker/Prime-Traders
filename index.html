<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Traders | Express & Logistics Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header Navigation -->
  <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-amber-500 text-slate-950 font-black text-2xl w-10 h-10 flex items-center justify-center rounded-xl shadow">P</div>
      <div>
        <h1 class="font-black text-xl tracking-wide text-white uppercase leading-none">Prime Traders</h1>
        <p class="text-[10px] text-amber-500 font-bold tracking-widest uppercase mt-0.5">Express & Logistics</p>
      </div>
    </div>

    <!-- Right Header Actions (Public Page) -->
    <div class="flex items-center gap-3">
      <a href="login.html" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition shadow flex items-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Client Login / Dashboard
      </a>
      <a href="https://wa.me/923000000000" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition flex items-center gap-2">
        <i class="fa-brands fa-whatsapp"></i> Support
      </a>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="container mx-auto px-6 py-12 flex-grow flex flex-col justify-center items-center text-center">
    
    <h2 class="text-3xl sm:text-5xl font-black text-white max-w-3xl leading-tight mb-4">
      Fast, Reliable & Nationwide Delivery Solutions
    </h2>
    <p class="text-slate-400 text-sm sm:text-base max-w-xl mb-8">
      Your trusted partner for Express Courier, Dropshipping Fulfillment, and Wholesale Supply Chain Services.
    </p>

    <!-- Track Your Parcel Box -->
    <div class="w-full max-w-xl bg-slate-900 p-6 sm:p-8 rounded-2xl border border-slate-800 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4 flex items-center justify-center gap-2">
        <i class="fa-solid fa-truck-fast text-amber-500"></i> Track Your Parcel
      </h3>
      
      <form onsubmit="trackOrder(event)" class="flex flex-col sm:flex-row gap-3">
        <input type="text" id="trackInput" placeholder="Enter Tracking ID (e.g. PT-1002)" class="flex-grow bg-slate-950 border border-slate-700 px-4 py-3 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition" required>
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-3 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow">
          <i class="fa-solid fa-magnifying-glass"></i> Track
        </button>
      </form>

      <!-- Tracking Result Container -->
      <div id="trackingResult" class="mt-6 hidden text-left bg-slate-950 p-4 rounded-xl border border-slate-800">
        <!-- Live result will populate here -->
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    &copy; Prime Traders. All rights reserved.
  </footer>

  <script src="dashboard.js"></script>
  <script>
    function trackOrder(e) {
      e.preventDefault();
      const trackId = document.getElementById("trackInput").value.trim();
      const resBox = document.getElementById("trackingResult");

      if (!trackId) return;

      resBox.classList.remove("hidden");
      resBox.innerHTML = `<p class="text-xs text-slate-400 text-center"><i class="fa-solid fa-spinner animate-spin"></i> Searching tracking records...</p>`;

      db.collection("parcels").where("trackingId", "==", trackId).get()
        .then((snapshot) => {
          if (snapshot.empty) {
            resBox.innerHTML = `<p class="text-xs text-rose-400 text-center font-semibold"><i class="fa-solid fa-circle-xmark"></i> No record found for Tracking ID: ${trackId}</p>`;
          } else {
            snapshot.forEach((doc) => {
              const data = doc.data();
              let statusBadge = 'bg-amber-950 text-amber-400 border-amber-800/50';
              if (data.status === 'Delivered') statusBadge = 'bg-emerald-950 text-emerald-400 border-emerald-800/50';
              if (data.status === 'In Transit') statusBadge = 'bg-blue-950 text-blue-400 border-blue-800/50';

              resBox.innerHTML = `
                <div class="space-y-2">
                  <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-xs font-mono font-bold text-amber-400">${data.trackingId}</span>
                    <span class="px-2 py-0.5 text-[10px] font-bold rounded border ${statusBadge}">${(data.status || 'Pending').toUpperCase()}</span>
                  </div>
                  <p class="text-xs text-slate-300"><strong>Receiver:</strong> ${data.customerName || 'N/A'}</p>
                  <p class="text-xs text-slate-300"><strong>Destination:</strong> ${data.city || 'N/A'}</p>
                  <p class="text-xs text-slate-300"><strong>COD Amount:</strong> Rs. ${data.codAmount || 0}</p>
                </div>
              `;
            });
          }
        })
        .catch(err => {
          resBox.innerHTML = `<p class="text-xs text-rose-400 text-center">Error fetching status: ${err.message}</p>`;
        });
    }
  </script>
</body>
</html>
